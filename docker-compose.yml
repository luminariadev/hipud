services:
  postgres:
    image: postgres:16-alpine
    container_name: hipud-db
    environment:
      POSTGRES_USER: hipud_user
      POSTGRES_PASSWORD: hipud_password
      POSTGRES_DB: hipud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hipud_user -d hipud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-preorder
      dockerfile: Dockerfile
    container_name: hipud-backend
    environment:
      DATABASE_URL: "postgresql://hipud_user:hipud_password@postgres:5432/hipud_db?sslmode=disable"
      DIRECT_URL: "postgresql://hipud_user:hipud_password@postgres:5432/hipud_db?sslmode=disable"
      PORT: "5000"
      JWT_SECRET: "hipud-super-secret-jwt-key-2026"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "hipud-admin-password"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-preorder
      dockerfile: Dockerfile
    container_name: hipud-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
